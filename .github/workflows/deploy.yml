name: deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # manual re-run from the Actions tab

# No permissions by default; the job asks for exactly what it needs.
permissions: {}

# Never cancel a running apply: a half-finished apply is worse than a queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The apply role only trusts jobs in this environment, and the environment
    # only accepts the main branch.
    environment: prod
    permissions:
      id-token: write # OIDC token to assume the apply role
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      SITE_URL: https://zihao-cv.site
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }} # sensitive: where alarms are sent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::030342421998:role/github-actions-apply
          aws-region: us-east-1

      # Plan and apply the saved plan in the same job, so exactly what was shown is applied.
      - name: Terraform plan
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/prod
        run: terraform apply -input=false -lock-timeout=60s tfplan

      - name: Invalidate the CloudFront cache
        working-directory: infra/envs/prod
        run: |
          DIST_ID=$(terraform output -raw CLOUDFRONT_DISTRIBUTION_ID)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        working-directory: infra/envs/prod
        run: ../../../scripts/smoke_test.sh "$SITE_URL" "$(terraform output -raw HEALTH_URL)"
