name: deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # manual re-run from the Actions tab

# No permissions by default; the job asks for exactly what it needs.
permissions: {}

# Never cancel a running apply: a half-finished apply is worse than a queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Build the Lambda packages and sign a provenance attestation for each one:
  # "this file, with this SHA-256, was built by this workflow, from this repo,
  # at this commit". Signed with Sigstore using the job's OIDC identity, so
  # there is no signing key to store or leak. Recorded in a public log.
  build:
    name: build and attest the Lambdas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing identity
      attestations: write # store the attestation in the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Lambda packages
        run: python3 scripts/build_lambdas.py

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambdas
          path: build/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The apply role only trusts jobs in this environment, and the environment
    # only accepts the main branch.
    environment: prod
    permissions:
      id-token: write # OIDC token to assume the apply role
      contents: read
      attestations: read # verify the Lambda attestations
    env:
      TF_IN_AUTOMATION: "true"
      SITE_URL: https://zihao-cv.site
      OPS_BUCKET: zihao-resume-dev-2026-v99 # where the /ops status files live
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }} # sensitive: where alarms are sent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambdas
          path: build/

      # Refuse to deploy a package unless it was attested by this workflow,
      # on main, at exactly this commit, on a GitHub-hosted runner. Anything
      # swapped in between build and deploy fails here.
      - name: Verify the Lambda provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for zip in build/*.zip; do
            gh attestation verify "$zip" \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/deploy.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::030342421998:role/github-actions-apply
          aws-region: us-east-1

      # Plan and apply the saved plan in the same job, so exactly what was shown is applied.
      - name: Terraform plan
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/prod
        run: terraform apply -input=false -lock-timeout=60s tfplan

      - name: Invalidate the CloudFront cache
        working-directory: infra/envs/prod
        run: |
          DIST_ID=$(terraform output -raw CLOUDFRONT_DISTRIBUTION_ID)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Smoke test
        working-directory: infra/envs/prod
        run: ../../../scripts/smoke_test.sh "$SITE_URL" "$(terraform output -raw HEALTH_URL)"

      # Status for the public /ops page. Runs even when an earlier step failed,
      # so a failed deploy shows up as failed. The commit title goes through jq
      # as data, never into the shell as code.
      - name: Publish deploy status
        if: always()
        env:
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg commit "${GITHUB_SHA::7}" \
            --arg title "$(git log -1 --format=%s)" \
            --arg result "$RESULT" \
            --arg finished_at "$(date -u +%FT%TZ)" \
            --arg run_url "$RUN_URL" \
            '{commit: $commit, title: $title, result: $result, finished_at: $finished_at, run_url: $run_url}' > deploy.json
          aws s3 cp deploy.json "s3://$OPS_BUCKET/ops/deploy.json" \
            --content-type application/json --cache-control "max-age=60"
